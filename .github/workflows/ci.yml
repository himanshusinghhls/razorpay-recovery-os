name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recoveryos
          POSTGRES_PASSWORD: recoveryos
          POSTGRES_DB: recoveryos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U recoveryos"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv apps/api/.venv
          ./apps/api/.venv/bin/pip install --upgrade pip
          ./apps/api/.venv/bin/pip install -r apps/api/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://recoveryos:recoveryos@localhost:5432/recoveryos
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key-min-32-characters-long
          API_KEY: ci-test-api-key-placeholder
          RAZORPAY_KEY_ID: rzp_test_ci_placeholder
          RAZORPAY_KEY_SECRET: ci_placeholder_secret
          RAZORPAY_WEBHOOK_SECRET: ci_webhook_secret
          GEMINI_API_KEY: ci_gemini_placeholder
          APP_ENV: test
        run: PYTHONPATH=. ./apps/api/.venv/bin/pytest tests/ -v

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build
