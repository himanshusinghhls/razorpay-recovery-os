services:

  postgres:
    image: postgres:16
    container_name: recovery-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery_password
      POSTGRES_DB: recovery_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs the ARQ job queue, distributed rate limiting and idempotency keys.
  # The app degrades rather than dies without it, but the worker cannot run.
  redis:
    image: redis:7-alpine
    container_name: recovery-os-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
