services:

  postgres:
    image: postgres:16
    container_name: recovery-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery_password
      POSTGRES_DB: recovery_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: recovery-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
